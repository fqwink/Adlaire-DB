services:
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    working_dir: /workspace
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target-cache:/workspace/target
    command: cargo test --workspace --locked

volumes:
  cargo-registry:
  cargo-git:
  target-cache:
